id: 6f7e3e31-f52d-4205-8c0d-26d06075d805
name: DNS - Posible tunelizacion o exfiltracion
description: |
  Detecta patrones compatibles con tunelizacion o exfiltracion por DNS:
  consultas largas, etiquetas largas, alta cardinalidad, muchas consultas TXT o muchos subdominios.
severity: High
requiredDataConnectors:
  - connectorId: DNS
    dataTypes:
      - DnsEvents
  - connectorId: WindowsSecurityEvents
    dataTypes:
      - Event
      - WindowsEvent
queryFrequency: 1h
queryPeriod: 7d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
  - Exfiltration
relevantTechniques:
  - T1071.004
  - T1048
query: |
  let Lookback = 7d;
  let MinTotalQueries = 100;
  let MinMaxQueryLength = 120;
  let MinAvgQueryLength = 70;
  let MinMaxLabelLength = 50;
  let MinTxtRatio = 0.20;
  let MinDistinctQueries = 80;
  fn_Correlate_DHCP_DNS(Lookback)
  | where IsReverseLookup == false
  | summarize
      TotalQueries = count(),
      DistinctQueries = dcount(QueryName),
      AvgQueryLength = avg(QueryLength),
      MaxQueryLength = max(QueryLength),
      AvgLabelCount = avg(LabelCount),
      MaxLabelLength = max(MaxLabelLength),
      TxtQueries = countif(toupper(QueryType) == "TXT"),
      SampleQueries = make_set(QueryName, 20),
      Hosts = make_set(HostName, 20),
      Macs = make_set(ClientMac, 20)
      by ClientIp, QueryRootDomain
  | extend TxtRatio = todouble(TxtQueries) / todouble(TotalQueries)
  | where
      TotalQueries >= MinTotalQueries
      and (
          MaxQueryLength >= MinMaxQueryLength
          or AvgQueryLength >= MinAvgQueryLength
          or MaxLabelLength >= MinMaxLabelLength
          or TxtRatio >= MinTxtRatio
          or DistinctQueries >= MinDistinctQueries
      )
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ClientIp
  - entityType: DNS
    fieldMappings:
      - identifier: DomainName
        columnName: QueryRootDomain
customDetails:
  TotalQueries: TotalQueries
  DistinctQueries: DistinctQueries
  AvgQueryLength: AvgQueryLength
  MaxQueryLength: MaxQueryLength
  MaxLabelLength: MaxLabelLength
  TxtQueries: TxtQueries
  TxtRatio: TxtRatio
  SampleQueries: SampleQueries
  Hosts: Hosts
  Macs: Macs
alertDetailsOverride:
  alertDisplayNameFormat: "DNS - Posible tunelizacion desde {{ClientIp}} hacia {{QueryRootDomain}}"
  alertDescriptionFormat: "Patron DNS anomalo: {{TotalQueries}} consultas, {{DistinctQueries}} consultas distintas, longitud maxima {{MaxQueryLength}}."
version: 1.0.0
kind: Scheduled

